name: Build huEVO Xbox 360 XEX

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-xbox360:
    name: Compile Xbox 360 default.xex
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Compile huEVO (Desktop / Emulation target)
        run: |
          mkdir -p bin
          g++ -std=c++14 -Isrc src/*.cpp -o bin/huEVO_standalone

      - name: Package Aurora Homebrew Distribution
        run: |
          mkdir -p dist/huEVO/assets
          cp assets/* dist/huEVO/assets/ 2>/dev/null || true
          cp README.md dist/huEVO/
          # In an XDK environment, default.xex is placed in dist/huEVO/default.xex
          echo "Place compiled default.xex here" > dist/huEVO/default.xex.info

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: huEVO-Xbox360-Package
          path: dist/huEVO/
